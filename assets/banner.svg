<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 036</title>
  <desc>Distil the source into one recognisable relationship drawn with a few fine, naturally paused continuous lines, then let two to four translucent, watercolour-edged colour fields follow its contour, motion, negative space, and emotional gravity.</desc>
  <defs><clipPath id="f"><rect width="1200" height="400" rx="30"/></clipPath><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
  <g clip-path="url(#f)">
    <rect width="1200" height="400" fill="#EFF7F4"/><circle cx="1080" cy="38" r="180" fill="#FFFFFF" fill-opacity=".34"/><circle cx="760" cy="390" r="200" fill="#87BFC1" fill-opacity=".1"/>
    <g transform="translate(58 42)"><rect width="224" height="34" rx="8" fill="#172D31"/><text x="16" y="22" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text><text y="112" fill="#172D31" font-family="Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="-3">PANEL <tspan fill="#F18E87">036</tspan></text><text x="2" y="151" fill="#87BFC1" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing=".32">ONE RELATION · FINE LINE · 2–4 COLOUR FIELDS · WATERCOLOUR EDGE · BREATHING SPACE</text><text x="2" y="198" fill="#172D31" font-family="sans-serif" font-size="18" font-weight="800">让连续细线承载关系，让透明色域缓慢流动</text><text x="2" y="230" fill="#3B555A" font-family="sans-serif" font-size="14" font-weight="700">写真を、透明な色域に運ばれる連続線へ</text><text x="2" y="260" fill="#3B555A" font-family="sans-serif" font-size="14" font-weight="700">사진을 투명한 색면이 흐르는 연속선으로</text><text x="2" y="291" fill="#3B555A" font-family="Arial,sans-serif" font-size="13" font-weight="700">تحويل الصورة إلى خط متصل تحمله حقول لونية شفافة</text></g>
    <g transform="translate(58 334)"><rect width="105" height="34" rx="8" fill="#172D31"/><text x="52.5" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">SOURCE-BOUND</text><rect x="117" width="88" height="34" rx="8" fill="#F18E87"/><text x="161" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">4 MODES</text><rect x="217" width="132" height="34" rx="8" fill="#87BFC1"/><text x="283" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">WALLPAPER PACK</text></g>
